[[plugins]]
package = "@netlify/plugin-nextjs"

[[edge_functions]]
function = "chat-stream"
path = "/api/chat/stream"

[[edge_functions]]
function = "chat-stream"
path = "/api/chat/stream/probe"

[[redirects]]
from = "/api/*"
to = "https://design-automation-assistant-api.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/auth/monday/*"
to = "https://design-automation-assistant-api.onrender.com/auth/monday/:splat"
status = 200
force = true
